<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>모여봐요 A+의 숲</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* PC 등 넓은 화면에서 볼 때 양옆 여백을 예쁜 숲 배경색으로 채움 */
            background-color: #1b5e20;
            font-family: 'Jua', 'Gamja Flower', '맑은 고딕', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---------------- [ 스마트폰 비율 프레임 컨테이너 ] ---------------- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 430px; /* 스마트폰 최대 폭 제한 */
            height: 100%;
            max-height: 932px; /* 스마트폰 최대 높이 제한 (아이폰 프로맥스 비율 기준) */
            display: flex;
            flex-direction: column;
            background-color: #e8f5e9;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-left: 3px solid rgba(255, 255, 255, 0.15);
            border-right: 3px solid rgba(255, 255, 255, 0.15);
        }

        @media (min-width: 431px) {
            #game-container {
                height: 92vh;
                border-radius: 36px; /* PC에서는 스마트폰처럼 모서리를 둥글게 처리 */
                border: 8px solid #33691e;
            }
        }

        /* ---------------- [ 세로 타이틀 화면 ] ---------------- */
        #title-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%;
            background-color: #388e3c;
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('image_28563c.jpg');
            background-size: cover;
            background-position: center;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-align: center;
            padding: 20px 15px;
        }

        .ac-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.4));
        }

        .ac-badge-row {
            display: flex;
            gap: 8px;
            margin-bottom: -10px;
            z-index: 2;
        }

        .ac-badge {
            width: clamp(38px, 8vw, 48px);
            height: clamp(38px, 8vw, 48px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(20px, 4.5vw, 24px);
            font-weight: 900;
            color: white;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .b-red { background-color: #ff5252; transform: rotate(-5deg); }
        .b-yellow { background-color: #ffb300; transform: rotate(3deg); }
        .b-green { background-color: #66bb6a; transform: rotate(-3deg); }
        .b-blue { background-color: #42a5f5; transform: rotate(4deg); }

        .ac-main-title {
            background: #fff8e1;
            padding: 10px clamp(18px, 5vw, 32px);
            border-radius: 40px;
            border: 5px solid #558b2f;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 -4px 0 #d7ccc8;
            transform: rotate(-1.5deg);
        }

        .ac-title-text {
            font-size: clamp(34px, 8.5vw, 52px);
            font-weight: 900;
            color: #f57f17;
            text-shadow: 
                -2px -2px 0 #ffffff,  
                 2px -2px 0 #ffffff,
                -2px  2px 0 #ffffff,
                 2px  2px 0 #ffffff,
                 3px  4px 0 #33691e;
            letter-spacing: 1px;
        }

        .ac-leaf-icon {
            width: clamp(34px, 7vw, 45px);
            height: clamp(34px, 7vw, 45px);
            animation: leafWiggle 2s infinite ease-in-out;
        }

        @keyframes leafWiggle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }

        .game-guide-card {
            background: rgba(255, 255, 255, 0.93);
            border: 4px solid #7cb342;
            border-radius: 20px;
            padding: 12px clamp(14px, 3.5vw, 24px);
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
            width: 92%;
            max-width: 420px;
            text-align: center;
        }

        .game-guide-title {
            font-size: clamp(16px, 3.8vw, 19px);
            font-weight: bold;
            color: #33691e;
            margin-bottom: 4px;
        }

        .game-guide-desc {
            font-size: clamp(13px, 3.1vw, 15px);
            line-height: 1.45;
            color: #333333;
            font-weight: bold;
            word-break: keep-all;
        }

        .game-guide-desc b {
            color: #e65100;
        }

        .touch-text {
            font-size: clamp(16px, 4vw, 20px);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: blink 1.5s infinite;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 32px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ---------------- [ 상단 헤더 ] ---------------- */
        .header-bar {
            height: clamp(48px, 7dvh, 55px);
            background-color: #689f38;
            color: white;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #33691e;
            flex-shrink: 0;
            z-index: 10;
        }

        .status-group {
            display: flex;
            gap: 12px;
            font-size: clamp(15px, 3.8vw, 19px);
            font-weight: bold;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 12px;
            border-radius: 15px;
        }

        .bgm-btn {
            background-color: #ffb74d;
            border: 2px solid #f57c00;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: clamp(13px, 3.2vw, 16px);
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        /* ---------------- [ 메인 화면 & 세로 3인칭 맵 ] ---------------- */
        .main-screen {
            flex: 1;
            background: linear-gradient(to bottom, #c8e6c9, #aed581);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .scene-location-badge {
            position: absolute;
            top: 12px;
            left: 14px;
            background: rgba(255, 255, 255, 0.95);
            color: #33691e;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: clamp(14px, 3.5vw, 17px);
            font-weight: bold;
            border: 2px solid #8bc34a;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 5;
        }

        #mission-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(46, 125, 50, 0.96);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 22px;
            font-size: clamp(13px, 3.5vw, 16px);
            font-weight: bold;
            border: 3px solid #fff59d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
            z-index: 100;
            display: none;
            width: max-content;
            max-width: 90%;
            text-align: center;
            white-space: nowrap;
        }

        .graphic-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        @keyframes dramaticHairFall {
            0% { transform: translateY(0px) rotate(0deg) scale(1); opacity: 1; }
            30% { transform: translateY(12px) rotate(-18deg) scale(1.15); opacity: 1; }
            65% { transform: translateY(32px) rotate(22deg) scale(1.05); opacity: 0.85; }
            100% { transform: translateY(58px) rotate(45deg) scale(0.9); opacity: 0; }
        }
        .falling-hair-1 { animation: dramaticHairFall 1.3s infinite ease-in-out; }
        .falling-hair-2 { animation: dramaticHairFall 1.3s infinite ease-in-out 0.4s; }
        .falling-hair-3 { animation: dramaticHairFall 1.3s infinite ease-in-out 0.8s; }

        @keyframes jump3TimesClean {
            0%, 100% { transform: translateY(0); }
            16.6%, 50%, 83.3% { transform: translateY(-34px); }
            33.3%, 66.6% { transform: translateY(0); }
        }
        .all-jumping-body {
            animation: jump3TimesClean 0.85s ease-in-out 1 forwards !important;
        }

        @keyframes hansbinTalkBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.02) rotate(-1.5deg); }
        }
        .hansbin-speaking {
            animation: hansbinTalkBounce 0.45s infinite ease-in-out;
            transform-origin: bottom center;
        }

        @keyframes walkApproachYoungwoo {
            0% { transform: translate(135px, 270px) scale(0.48); }
            30% { transform: translate(165px, 230px) scale(0.48) rotate(-4deg); }
            60% { transform: translate(210px, 180px) scale(0.48) rotate(4deg); }
            100% { transform: translate(255px, 130px) scale(0.48) rotate(0deg); }
        }
        @keyframes walkApproachKangbin {
            0% { transform: translate(185px, 270px) scale(0.48); }
            30% { transform: translate(215px, 230px) scale(0.48) rotate(4deg); }
            60% { transform: translate(260px, 180px) scale(0.48) rotate(-4deg); }
            100% { transform: translate(305px, 130px) scale(0.48) rotate(0deg); }
        }

        .youngwoo-walking {
            animation: walkApproachYoungwoo 1s cubic-bezier(0.25, 1, 0.5, 1) 1 forwards !important;
        }
        .kangbin-walking {
            animation: walkApproachKangbin 1s cubic-bezier(0.25, 1, 0.5, 1) 1 forwards !important;
        }

        @keyframes steamRise {
            0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
            50% { transform: translateY(-8px) scaleX(1.25); opacity: 0.4; }
            100% { transform: translateY(-16px) scaleX(1.4); opacity: 0; }
        }
        .steam-effect-1 { animation: steamRise 1.5s infinite ease-out; }

        .bottom-panel {
            height: clamp(160px, 24dvh, 210px);
            background: #ffffff;
            border-top: 5px solid #8bc34a;
            padding: 10px clamp(10px, 2.5vw, 18px);
            display: flex;
            align-items: center;
            gap: clamp(10px, 2.5vw, 16px);
            flex-shrink: 0;
            cursor: pointer;
            z-index: 200;
        }

        #joystick-wrapper {
            width: clamp(95px, 24vw, 120px);
            height: clamp(95px, 24vw, 120px);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        #joystick-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(139, 195, 74, 0.15);
            border: 3px solid #7cb342;
            border-radius: 50%;
            touch-action: none;
            display: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
        }

        #joystick-thumb {
            position: absolute;
            top: calc(50% - clamp(18px, 4.5vw, 23px));
            left: calc(50% - clamp(18px, 4.5vw, 23px));
            width: clamp(36px, 9vw, 46px);
            height: clamp(36px, 9vw, 46px);
            background: #8bc34a;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }

        .dialogue-box {
            flex: 1;
            height: 100%;
            background: #f1f8e9;
            border: 3px solid #c5e1a5;
            border-radius: 18px;
            padding: clamp(10px, 2vh, 15px) clamp(12px, 3vw, 20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
            min-width: 0;
        }

        .dialogue-text {
            font-size: clamp(15px, 3.8vw, 19px);
            line-height: 1.5;
            color: #2e7d32;
            font-weight: bold;
            overflow-y: auto;
            word-break: keep-all;
        }

        .tap-indicator {
            align-self: flex-end;
            font-size: clamp(12px, 3vw, 14px);
            color: #558b2f;
            font-weight: bold;
            animation: pulseTap 1.2s infinite ease-in-out;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        @keyframes pulseTap {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.4; transform: translateY(3px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="mission-banner">🎯 미션: 박근식을 찾아가서 대화를 나누세요!</div>

        <div id="title-screen" onclick="startGame()">
            <div class="ac-logo-box">
                <div class="ac-badge-row">
                    <div class="ac-badge b-red">모</div>
                    <div class="ac-badge b-yellow">여</div>
                    <div class="ac-badge b-green">봐</div>
                    <div class="ac-badge b-blue">요</div>
                </div>
                <div class="ac-main-title">
                    <span class="ac-title-text">A+의 숲</span>
                    <svg class="ac-leaf-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 10 C80 10 90 40 90 70 C90 85 75 90 60 90 C30 90 10 60 10 30 C10 15 25 10 50 10 Z" fill="#8BC34A" stroke="#33691E" stroke-width="5"/>
                        <path d="M25 75 Q 50 50 80 20" stroke="#33691E" stroke-width="5" stroke-linecap="round"/>
                        <path d="M45 55 Q 60 65 70 60" stroke="#33691E" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <div class="game-guide-card">
                <div class="game-guide-title">🎓 [ 게임 목표 ]</div>
                <div class="game-guide-desc">동기들과 소통하며 <b>우정</b>과 <b>지식</b>을 채우고,<br>최종 <b>A+학점</b>을 받아보세요!</div>
            </div>

            <div class="touch-text">화면을 터치하여 시작하기</div>
        </div>

        <div class="header-bar">
            <div class="status-group">
                <div class="status-item">🧠 지식: <span id="stat-knowledge">0</span></div>
                <div class="status-item">🤝 우정: <span id="stat-friendship">0</span></div>
            </div>
            <button class="bgm-btn" id="bgm-toggle" onclick="toggleBGM(event)">🎵 BGM 켜기</button>
        </div>

        <div class="main-screen" id="main-screen">
            <div class="scene-location-badge" id="scene-location">학교 정문</div>
            <div class="graphic-wrapper" id="graphic-wrapper" onclick="handleScreenClick()"></div>
        </div>

        <div class="bottom-panel" onclick="handleScreenClick()">
            <div id="joystick-wrapper">
                <div id="joystick-container">
                    <div id="joystick-thumb"></div>
                </div>
            </div>

            <div class="dialogue-box">
                <div class="dialogue-text" id="dialogue-text"></div>
                <div class="tap-indicator" id="tap-indicator">화면을 터치하세요 ▼</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            let bgmPlaying = false;
            let isStarted = false;
            let gameData = { knowledge: 0, friendship: 0, currentScene: 0 };
            let hasMovedInWalkMode = false;

            let playerPos = { x: 50, y: 450 };
            let joystickVec = { x: 0, y: 0 };
            let isJoystickActive = false;
            const moveSpeed = 3.8;
            let keysPressed = {};
            
            let currentNearbyNpc = null;
            let dialogueState = 'IDLE';

            let audioCtx = null;
            let musicInterval = null;
            let stepCounter = 0;

            function initHealingMusic() {
                if (audioCtx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }

            function playDynamicMelody() {
                if (!audioCtx || !bgmPlaying) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const chords = [
                    [523.25, 659.25, 783.99], 
                    [587.33, 698.46, 880.00], 
                    [659.25, 830.61, 987.77], 
                    [698.46, 880.00, 1046.50] 
                ];

                const currentChord = chords[Math.floor(stepCounter / 8) % chords.length];
                const note = currentChord[stepCounter % currentChord.length];
                const isClimax = (stepCounter % 32 >= 24);
                const playFreq = isClimax ? note * 1.5 : note;

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = isClimax ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(playFreq, audioCtx.currentTime);

                const volume = isClimax ? 0.14 : 0.08;
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.06);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (isClimax ? 0.6 : 0.35));

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.65);

                stepCounter++;
            }

            function startDynamicHealingBGM() {
                initHealingMusic();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                bgmPlaying = true;
                const btn = document.getElementById('bgm-toggle');
                if(btn) btn.innerText = "🔇 BGM 끄기";

                if (!musicInterval) {
                    stepCounter = 0;
                    playDynamicMelody();
                    musicInterval = setInterval(() => {
                        if (bgmPlaying) playDynamicMelody();
                    }, 180);
                }
            }

            function stopDynamicHealingBGM() {
                bgmPlaying = false;
                const btn = document.getElementById('bgm-toggle');
                if(btn) btn.innerText = "🎵 BGM 켜기";
                if (musicInterval) {
                    clearInterval(musicInterval);
                    musicInterval = null;
                }
            }

            window.toggleBGM = function(e) {
                if (e) e.stopPropagation();
                if (bgmPlaying) {
                    stopDynamicHealingBGM();
                } else {
                    startDynamicHealingBGM();
                }
            };

            let processedHeadUrl = '증사_2.jpg';
            let processedGeunsikUrl = '박근식.jpg';
            let processedYoungwooUrl = '김영우.jpg';
            let processedChanyoungUrl = '김찬영.jpg';
            let processedKangbinUrl = '박강빈.jpg';

            const classroomNpcs = [
                { id: 'npc_geunsik', name: '박근식', x: 155, y: 130, type: 'photo', photoUrl: () => processedGeunsikUrl, clipId: 'headCutoutGeunsik', shirtColor: '#3F51B5', isTarget: true, showTag: true, imgX: 12, imgY: -2, imgW: 100, imgH: 125 },
                { id: 'npc_chanyoung', name: '김찬영', x: 205, y: 130, type: 'photo', photoUrl: () => processedChanyoungUrl, clipId: 'headCutoutStandard', shirtColor: '#D84315', reply: "김찬영 : 나 근식이이랑 같이 석유화학공업 수업 복습 중이었어!", showTag: true, imgX: -12, imgY: -15, imgW: 150, imgH: 195 },
                { id: 'npc_youngwoo', name: '김영우', x: 135, y: 270, approachX: 255, approachY: 130, type: 'photo', photoUrl: () => processedYoungwooUrl, clipId: 'headCutoutStandard', shirtColor: '#1565C0', reply: "김영우 : 안녕 얘들아? 석유화학공업 강의 이해됐니...?", showTag: true, imgX: -12, imgY: -14, imgW: 150, imgH: 195 },
                { id: 'npc_kangbin', name: '박강빈', x: 185, y: 270, approachX: 305, approachY: 130, type: 'photo', photoUrl: () => processedKangbinUrl, clipId: 'headCutoutKangbinUltra', shirtColor: '#2E7D32', reply: "박강빈 : ...", showTag: true, imgX: -2, imgY: 8, imgW: 130, imgH: 155 },
                { id: 'npc_generic1', name: '동기1', x: 60, y: 270, type: 'drawn', hairColor: '#E91E63', shirtColor: '#8E24AA', reply: "동기 1 : 야, 바쁜데 모르는 거 물어보지 마라...", showTag: false },
                { id: 'npc_generic2', name: '동기2', x: 295, y: 270, type: 'drawn', hairColor: '#FF9800', shirtColor: '#F57C00', reply: "동기 2 : 무슨 할 말 있어? 나 공부해야 되니까 귀찮게 하지 마.", showTag: false }
            ];

            const scenarios = [
                { location: "학교 정문", text: "입학 전에는 매일 놀기만 하고 공부는 하나도 안 했었는데... 이제 정말 열심히 해보자!!", isWalkMode: false },
                { location: "전공 강의실", text: "아는 친구들이 아무도 없다... 그래도 나만 열심히 하면 되겠지?", isWalkMode: false },
                { location: "전공 강의실", text: "다른 건 다 괜찮은데 [석유화학공업] 과목이 너무 어렵다... 머리카락이 빠질 거 같아!", isWalkMode: false },

            function processPhotoAlpha(filename, setter) {
                const img = new Image();

                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imgData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i], g = data[i + 1], b = data[i + 2];
                            if (r > 140 && g > 140 && b > 140) {
                                const maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
                                if (maxC - minC < 32) data[i + 3] = 0;
                            }
                        }
                        ctx.putImageData(imgData, 0, 0);
                        setter(canvas.toDataURL('image/png'));
                        renderScene();
                    } catch (e) {
                        setter(filename);
                        renderScene();
                    }
                };
                img.onerror = function() { setter(filename); };

            const joystickContainer = document.getElementById('joystick-container');

            function handleJoystickStart(e) {
                isJoystickActive = true;
                hasMovedInWalkMode = true;
                updateMissionBannerVisibility();
                updateJoystick(e);
            }

            function handleJoystickMove(e) {
                if (!isJoystickActive) return;
                updateJoystick(e);
            }

            function handleJoystickEnd() {
                isJoystickActive = false;
                joystickVec = { x: 0, y: 0 };
                if (joystickThumb) joystickThumb.style.transform = `translate(0px, 0px)`;
            }

            function updateJoystick(e) {
                const rect = joystickContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const touch = e.touches ? e.touches[0] : e;
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const maxRadius = rect.width / 2.8;
                const distance = Math.hypot(dx, dy);
                if (distance > maxRadius) {
                    dx = (dx / distance) * maxRadius;
                    dy = (dy / distance) * maxRadius;
                }
                if (joystickThumb) joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVec.x = dx / maxRadius;
                joystickVec.y = dy / maxRadius;
            }

            if (joystickContainer) {
                joystickContainer.addEventListener('touchstart', handleJoystickStart, { passive: false });
                window.addEventListener('touchmove', handleJoystickMove, { passive: false });
                window.addEventListener('touchend', handleJoystickEnd);
                joystickContainer.addEventListener('mousedown', handleJoystickStart);
                window.addEventListener('mousemove', handleJoystickMove);
                window.addEventListener('mouseup', handleJoystickEnd);
            }

            window.addEventListener('keydown', e => {

                    updateMissionBannerVisibility();

            function updatePlayerFace() {
                const bodyElem = document.getElementById('player-inner-body');
                const shadowElem = document.getElementById('player-shadow');
                const isJumping = (dialogueState === 'GEUNSIK_4');
                if (bodyElem) {
                    if (isJumping) {
                        bodyElem.classList.add('joy-jumping-body');
                        if (shadowElem) shadowElem.classList.add('joy-jumping-shadow');
                    } else {
                        bodyElem.classList.remove('joy-jumping-body');
                        if (shadowElem) shadowElem.classList.remove('joy-jumping-shadow');
                    }
                }
            }

                const banner = document.getElementById('mission-banner');

                if (banner) {
                    if (current && current.isWalkMode && !hasMovedInWalkMode) {
                        banner.style.display = 'block';
                    } else {
                        banner.style.display = 'none';
                    }
                }
            }

            function gameLoop() {
                const current = scenarios[gameData.currentScene];
                if (current && current.isWalkMode) {
                    let moveX = joystickVec.x;
                    let moveY = joystickVec.y;

                    if (keysPressed['ArrowLeft'] || keysPressed['a']) { moveX = -1; hasMovedInWalkMode = true; }
                    if (keysPressed['ArrowRight'] || keysPressed['d']) { moveX = 1; hasMovedInWalkMode = true; }
                    if (keysPressed['ArrowUp'] || keysPressed['w']) { moveY = -1; hasMovedInWalkMode = true; }
                    if (keysPressed['ArrowDown'] || keysPressed['s']) { moveY = 1; hasMovedInWalkMode = true; }

                    if (moveX !== 0 || moveY !== 0) {
                        updateMissionBannerVisibility();
                    }

                    playerPos.x += moveX * moveSpeed;
                    playerPos.y += moveY * moveSpeed;
                    playerPos.x = Math.max(20, Math.min(360, playerPos.x));
                    playerPos.y = Math.max(30, Math.min(460, playerPos.y));

                    const playerElem = document.getElementById('player-avatar-3d');
                    if (playerElem) {
                        playerElem.setAttribute('transform', `translate(${playerPos.x}, ${playerPos.y}) scale(0.48)`);
                    }

                    updatePlayerFace();

                    let closeNpc = null;
                    classroomNpcs.forEach(npc => {
                        const dist = Math.hypot(playerPos.x - npc.x, playerPos.y - npc.y);
                        if (dist < 55) closeNpc = npc;
                    });

                    const txtElem = document.getElementById('dialogue-text');
                    const tapIndicator = document.getElementById('tap-indicator');

                    if (closeNpc) {
                        if (currentNearbyNpc !== closeNpc && dialogueState === 'IDLE') {
                            currentNearbyNpc = closeNpc;
                            dialogueState = 'PROMPT';
                        }

                        if (dialogueState === 'PROMPT') {
                            if (txtElem) txtElem.innerHTML = `👦 <b>배진울:</b> "안녕? 나는 배진울 이라고 해! 석유화학공업 강의 어렵지 않았니...?"`;
                            if (tapIndicator) tapIndicator.innerText = "👇 터치하여 동기의 대답 듣기";
                        } else if (closeNpc.isTarget) {
                            if (dialogueState === 'GEUNSIK_1') {
                                if (txtElem) txtElem.innerHTML = `🧑 <b>박근식:</b> "맞아...너무 어렵더라 ㅠ 혹시 몇 살이야?"`;
                                if (tapIndicator) tapIndicator.innerText = "👇 터치하여 나이 대답하기";
                            } else if (dialogueState === 'GEUNSIK_2') {
                                if (txtElem) txtElem.innerHTML = `👦 <b>배진울:</b> "나는 22살이야!"`;
                                if (tapIndicator) tapIndicator.innerText = "👇 터치하여 근식이 대답 듣기";
                            } else if (dialogueState === 'GEUNSIK_3') {
                                if (txtElem) txtElem.innerHTML = `🧑 <b>박근식:</b> "오! 나도 22살이야! 우리 친구할래...? 같이 공부도 하고 밥도 먹고!!"`;
                                if (tapIndicator) tapIndicator.innerText = "👇 터치하여 대답하기";
                            } else if (dialogueState === 'GEUNSIK_4') {
                                if (txtElem) txtElem.innerHTML = `👦 <b>배진울:</b> "좋아 근식아!!"`;
                                if (tapIndicator) tapIndicator.innerText = "🚶 동기들이 걸어오는 중...";
                            } else if (dialogueState === 'APPROACH_TALK_1') {
                                if (txtElem) txtElem.innerHTML = `🧑 <b>김영우:</b> "안녕 얘들아? 석유화학공업 강의 이해됐니...?"`;
                                if (tapIndicator) tapIndicator.innerText = "👇 터치하여 대화 이어가기";
                            } else if (dialogueState === 'APPROACH_TALK_2') {
                                if (txtElem) txtElem.innerHTML = `🧑 <b>박강빈:</b> "우리 다같이 공부해볼래...?"`;
                                if (tapIndicator) tapIndicator.innerText = "👇 터치하여 대화 이어가기";
                            } else if (dialogueState === 'APPROACH_TALK_3') {
                                if (txtElem) txtElem.innerHTML = `🧑 <b>김찬영:</b> "좋아! 일단 점심시간이니까 한스빈 먹으러 가자!!"`;
                                if (tapIndicator) tapIndicator.innerText = "👇 터치하여 대답하기";

                            if (tapIndicator) tapIndicator.innerText = "🎯 박근식을 찾아 다가가보세요!";
                        }
                    }
                }
                requestAnimationFrame(gameLoop);

            requestAnimationFrame(gameLoop);

                const current = scenarios[gameData.currentScene];

                    if (currentNearbyNpc) {
                        if (currentNearbyNpc.isTarget) {
                            if (dialogueState === 'PROMPT') dialogueState = 'GEUNSIK_1';
                            else if (dialogueState === 'GEUNSIK_1') dialogueState = 'GEUNSIK_2';

            };

            function advanceDialogue() {
                if (gameData.currentScene < scenarios.length - 1) {
                    gameData.currentScene++;
                } else {
                    gameData.currentScene = 0;
                    gameData.knowledge = 0;
                    gameData.friendship = 0;
                    playerPos = { x: 50, y: 450 };
                    dialogueState = 'IDLE';
                }
                hasMovedInWalkMode = false;

                if (gameData.currentScene === 5) {
                    gameData.friendship += 5;
                }
                if (gameData.currentScene === 6) {
                    gameData.knowledge += 5;
                }

                renderScene();
            }

            function updateUI() {
                const kElem = document.getElementById('stat-knowledge');
                const fElem = document.getElementById('stat-friendship');
                if (kElem) kElem.innerText = gameData.knowledge;
                if (fElem) fElem.innerText = gameData.friendship;
            }

            function renderScene() {
                const current = scenarios[gameData.currentScene];
                const locElem = document.getElementById('scene-location');
                const txtElem = document.getElementById('dialogue-text');
                const mainScreen = document.getElementById('main-screen');
                const graphicWrapper = document.getElementById('graphic-wrapper');
                const joystickUI = document.getElementById('joystick-container');
                const tapIndicator = document.getElementById('tap-indicator');

                if (locElem) locElem.innerText = current.location;
                
                if (current.isHansbinTalk && hansbinTalkStep === 0) {
                    if (txtElem) txtElem.innerHTML = current.text;
                } else if (!current.isHansbinTalk) {
                    if (txtElem) txtElem.innerText = current.text;
                }

                if (gameData.currentScene === 0) {
                    if (mainScreen) mainScreen.style.backgroundImage = "linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), url('image_28563c.jpg')";
                } else {
                    if (mainScreen) {
                        mainScreen.style.backgroundImage = "none";
                        mainScreen.style.background = "#e8e0d0";
                    }
                }

                if (current.isWalkMode) {
                    if (joystickUI) joystickUI.style.display = 'block';
                    if (tapIndicator) tapIndicator.innerText = "🎯 박근식을 찾아 대화를 나누세요!";
                } else {
                    if (joystickUI) joystickUI.style.display = 'none';
                    if (tapIndicator) tapIndicator.innerText = "화면을 터치하세요 ▼";
                }

                if (graphicWrapper) graphicWrapper.innerHTML = getSceneGraphic(gameData.currentScene);
                updateMissionBannerVisibility();
                updateUI();
            }

            renderScene();
        });
    </script>
</body>
</html>
